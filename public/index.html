<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .header {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            background-color: #333;
            color: #fff;
        }
        .cart {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .container {
            display: flex;
            justify-content: center;
            padding: 50px;
        }
        .product-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .product-card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .add-to-cart-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        .add-to-cart-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="cart">
            🛒 Carrito: <span id="cart-count">0</span>
        </div>
    </header>

    <main class="container">
        <div class="product-card">
            <h2>Zapatillas Deportivas</h2>
            <p>Talla: 42 | Color: Azul</p>
            <p><strong>$49.99</strong></p>
            <button id="add-to-cart-btn" class="add-to-cart-btn">Añadir al Carrito</button>
        </div>
    </main>

    <script>
        const addToCartBtn = document.getElementById('add-to-cart-btn');
        const cartCountElement = document.getElementById('cart-count');

        addToCartBtn.addEventListener('click', () => {
            const currentCount = parseInt(cartCountElement.textContent, 10);
            cartCountElement.textContent = currentCount + 1;
        });
    </script>

</body>
</html>
